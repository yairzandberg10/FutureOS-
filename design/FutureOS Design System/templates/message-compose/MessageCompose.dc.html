<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Message compose bar" description="The bottom bar of a message screen: recipient line, draft field with counter, send status (שולח / נשלח / נכשל) and soft keys." -->
<helmet>
<script src="./ds-base.js"></script>
<style>html,body{margin:0;background:#0A0A0B}@keyframes fosCaret{0%,49%{opacity:1}50%,100%{opacity:0}}</style>
</helmet>
<div style="width:640px;height:960px;margin:0 auto;background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl;position:relative;overflow:hidden;display:flex;flex-direction:column">
<x-import component-from-global-scope="FutureOSDesignSystem_3ab611.TopBar" title="הודעה חדשה" onBack="{{ noop }}" onMenu="{{ noop }}" hint-size="640px,120px"></x-import>
<div style="flex:1;min-height:0;padding:24px 32px 8px;display:flex;flex-direction:column;justify-content:flex-end;gap:20px">
<div style="align-self:flex-start;max-width:440px;background:var(--fos-surface);border-radius:40px 40px 12px 40px;padding:22px 28px;font-size:30px;line-height:1.35;color:var(--fos-text);text-align:start">אתה בדרך?</div>
<div style="align-self:flex-end;max-width:440px;background:var(--fos-accent);border-radius:40px 40px 40px 12px;padding:22px 28px;font-size:30px;line-height:1.35;color:var(--fos-bg);text-align:start">יוצא עוד רגע</div>
<div style="align-self:flex-end;display:flex;align-items:center;gap:10px;margin-top:-12px;padding:0 6px">
<sc-if value="{{ showSending }}" hint-placeholder-val="{{ false }}">
<span style="display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:500;color:var(--fos-text-60)">
<x-import component-from-global-scope="FutureOSDesignSystem_3ab611.FosIcon" name="schedule" size="{{ 26 }}" color="var(--fos-text-60)" hint-size="26px,26px"></x-import>
שולח…
</span>
</sc-if>
<sc-if value="{{ showSent }}" hint-placeholder-val="{{ true }}">
<span style="display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:500;color:var(--fos-accent)">
<x-import component-from-global-scope="FutureOSDesignSystem_3ab611.FosIcon" name="check" size="{{ 26 }}" color="var(--fos-accent)" hint-size="26px,26px"></x-import>
נשלח · 14:03
</span>
</sc-if>
<sc-if value="{{ showFailed }}" hint-placeholder-val="{{ false }}">
<span style="display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:500;color:var(--fos-danger)">
<x-import component-from-global-scope="FutureOSDesignSystem_3ab611.FosIcon" name="error" size="{{ 26 }}" color="var(--fos-danger)" hint-size="26px,26px"></x-import>
לא נשלח
</span>
</sc-if>
</div>

</div>
<div style="background:var(--fos-bg);padding:12px 24px 28px;display:flex;flex-direction:column">
<div style="order:1;display:flex;align-items:center;gap:12px;padding:0 12px 10px;min-height:38px">
<span style="font-size:24px;color:var(--fos-text-40);flex:0 0 auto">אל</span>
<sc-if value="{{ hasRecipient }}" hint-placeholder-val="{{ true }}">
<span style="font-size:24px;font-weight:500;color:var(--fos-text-70);white-space:nowrap">{{ recipient }}</span>
</sc-if>
<sc-if value="{{ noRecipient }}" hint-placeholder-val="{{ false }}">
<span style="font-size:24px;color:var(--fos-text-40)">בחר נמען</span>
</sc-if>
<span style="flex:1"></span>

</div>
<div style="order:3;display:flex;align-items:flex-end;gap:16px">
<div style="flex:1;min-width:0;display:flex;align-items:center;gap:20px;background:var(--fos-surface);border:2px solid var(--fos-accent);box-shadow:0 0 0 4px color-mix(in oklab,var(--fos-accent) 22%,transparent);border-radius:48px;padding:0 28px;min-height:96px">
<div tabindex="0" style="flex:0 0 auto;width:56px;height:56px;border-radius:9999px;display:flex;align-items:center;justify-content:center;outline:none;cursor:pointer" style-hover="background:var(--fos-text-10)" style-focus="box-shadow:0 0 0 3px var(--fos-accent)">
<x-import component-from-global-scope="FutureOSDesignSystem_3ab611.FosIcon" name="add" size="{{ 40 }}" color="var(--fos-text-40)" hint-size="40px,40px"></x-import>
</div>
<div style="flex:1;min-width:0;padding:22px 0">
<sc-if value="{{ hasDraft }}" hint-placeholder-val="{{ true }}">
<div style="font-size:30px;line-height:1.35;color:var(--fos-text);max-height:124px;overflow:hidden">{{ draft }}<span style="display:inline-block;width:3px;height:30px;vertical-align:-5px;margin-inline-start:2px;background:var(--fos-accent);animation:fosCaret 1.1s step-end infinite"></span></div>
</sc-if>
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
<div style="font-size:30px;line-height:1.35;color:var(--fos-text-40)">הודעה</div>
</sc-if>
</div>
<div tabindex="0" style="flex:0 0 auto;width:56px;height:56px;border-radius:9999px;display:flex;align-items:center;justify-content:center;outline:none;cursor:pointer" style-hover="background:var(--fos-text-10)" style-focus="box-shadow:0 0 0 3px var(--fos-accent)">
<x-import component-from-global-scope="FutureOSDesignSystem_3ab611.FosIcon" name="mic" size="{{ 40 }}" color="var(--fos-text-40)" hint-size="40px,40px"></x-import>
</div>
</div>
<div tabindex="0" style="flex:0 0 auto;width:96px;height:96px;border-radius:9999px;background:var(--fos-accent);display:flex;align-items:center;justify-content:center;outline:none;cursor:pointer" style-hover="filter:brightness(1.08)" style-focus="box-shadow:0 0 0 4px var(--fos-bg),0 0 0 8px var(--fos-accent)">
<x-import component-from-global-scope="FutureOSDesignSystem_3ab611.FosIcon" name="send" size="{{ 46 }}" color="var(--fos-bg)" hint-size="46px,46px"></x-import>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:960},&quot;recipient&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;מיכל לוי&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;תוכן&quot;},&quot;draft&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;נתראה בערב ליד הכניסה&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;תוכן&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;typing&quot;,&quot;sending&quot;,&quot;sent&quot;,&quot;failed&quot;],&quot;default&quot;:&quot;typing&quot;,&quot;tsType&quot;:&quot;\&quot;typing\&quot; | \&quot;sending\&quot; | \&quot;sent\&quot; | \&quot;failed\&quot;&quot;,&quot;section&quot;:&quot;מצב שליחה&quot;},&quot;showCounter&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;מצב שליחה&quot;}}">
class Component extends DCLogic {
  state = { draft: null, status: null };

  get draft() {
    const d = this.state.draft;
    return d === null ? (this.props.draft ?? "נתראה בערב ליד הכניסה") : d;
  }

  get status() {
    return this.state.status || this.props.status || "typing";
  }

  componentDidMount() {
    this.onKey = (e) => {
      if (e.key === "Enter") { this.send(); e.preventDefault(); return; }
      if (e.key === "f") { this.setState({ status: "failed" }); return; }
      if (e.key === "Escape") { this.setState({ draft: "", status: "typing" }); return; }
      if (e.key === "Backspace") { this.setState({ draft: this.draft.slice(0, -1), status: "typing" }); e.preventDefault(); return; }
      if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) this.setState({ draft: this.draft + e.key, status: "typing" });
    };
    window.addEventListener("keydown", this.onKey);
  }

  componentWillUnmount() { window.removeEventListener("keydown", this.onKey); clearTimeout(this.t); }

  send() {
    if (!this.draft.trim()) return;
    this.setState({ status: "sending" });
    clearTimeout(this.t);
    this.t = setTimeout(() => this.setState({ status: "sent" }), 1100);
  }

  renderVals() {
    const draft = this.draft;
    const status = this.status;
    const recipient = this.props.recipient ?? "מיכל לוי";
    const n = draft.length;
    const segments = Math.max(1, Math.ceil(n / 70));
    const map = {
      typing:  { icon: null, text: "", color: null, left: "תפריט", center: "שלח", right: "מחק" },
      sending: { icon: "schedule", text: "שולח…", color: "var(--fos-text-60)", left: "", center: "", right: "בטל" },
      sent:    { icon: "check", text: "נשלח · 14:03", color: "var(--fos-success)", left: "תפריט", center: "חדש", right: "סגור" },
      failed:  { icon: "error", text: "לא נשלח", color: "var(--fos-danger)", left: "תפריט", center: "נסה שוב", right: "מחק" }
    };
    const s = map[status] || map.typing;
    return {
      noop: () => {},
      recipient,
      hasRecipient: !!recipient,
      noRecipient: !recipient,
      draft,
      hasDraft: n > 0,
      isEmpty: n === 0,
      counter: (this.props.showCounter ?? true) ? n + "/160 · " + segments : "",
      showSending: status === "sending",
      showSent: status === "sent",
      showFailed: status === "failed",
      softLeft: s.left,
      softCenter: s.center,
      softRight: s.right
    };
  }
}
</script>
</body>
</html>
