<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl;height:290px;box-sizing:border-box;padding:20px;overflow:hidden}
.g{display:flex;gap:10px;height:100%}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;border-radius:12px;padding:10px;box-sizing:border-box;min-width:0}
.n{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v{font-family:var(--fos-font-mono);font-size:16px;opacity:.65;white-space:nowrap}
.lbl{font-size:18px;color:var(--fos-text-40);letter-spacing:1px}
a{color:var(--fos-accent)}a:hover{opacity:.7}
</style></head><body><div style="display:flex;flex-direction:column;gap:7px;font-size:20px">
<div style="display:flex;gap:16px;align-items:baseline"><div style="width:190px;flex:0 0 auto;font-weight:600">למעלה / למטה</div><div style="opacity:.6;font-size:19px">move between items in a vertical list</div></div><div style="display:flex;gap:16px;align-items:baseline"><div style="width:190px;flex:0 0 auto;font-weight:600">שמאלה</div><div style="opacity:.6;font-size:19px">next item in a horizontal list — left is forward in RTL</div></div><div style="display:flex;gap:16px;align-items:baseline"><div style="width:190px;flex:0 0 auto;font-weight:600">ימינה</div><div style="opacity:.6;font-size:19px">previous item</div></div><div style="display:flex;gap:16px;align-items:baseline"><div style="width:190px;flex:0 0 auto;font-weight:600">אישור</div><div style="opacity:.6;font-size:19px">activate the focused item</div></div><div style="display:flex;gap:16px;align-items:baseline"><div style="width:190px;flex:0 0 auto;font-weight:600">חזרה</div><div style="opacity:.6;font-size:19px">leave the screen. Never moves focus</div></div><div style="display:flex;gap:16px;align-items:baseline"><div style="width:190px;flex:0 0 auto;font-weight:600">1–9</div><div style="opacity:.6;font-size:19px">jump straight to the n-th item, up to nine</div></div><div style="display:flex;gap:16px;align-items:baseline"><div style="width:190px;flex:0 0 auto;font-weight:600">תפריט</div><div style="opacity:.6;font-size:19px">open the screen's options menu</div></div>
</div></body></html>
