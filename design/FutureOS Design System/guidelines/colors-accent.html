<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl;height:170px;box-sizing:border-box;padding:20px;overflow:hidden}

</style></head><body><div class="g">

<div class="sw" style="background:#FF9F0A;color:#000000;"><div class="n">orange</div><div class="v">#FF9F0A</div></div>

<div class="sw" style="background:#BF5AF2;color:#000000;"><div class="n">purple</div><div class="v">#BF5AF2</div></div>
</div></body></html>
