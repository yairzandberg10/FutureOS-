<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl;height:150px;box-sizing:border-box;padding:20px;overflow:hidden}
.g{display:flex;gap:10px;height:100%}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;border-radius:12px;padding:10px;box-sizing:border-box;min-width:0}
.n{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v{font-family:var(--fos-font-mono);font-size:16px;opacity:.65;white-space:nowrap}
.lbl{font-size:18px;color:var(--fos-text-40);letter-spacing:1px}
a{color:var(--fos-accent)}a:hover{opacity:.7}
body{background:#F2F2F7;color:#000}.sw{border-color:rgba(0,0,0,.12) !important}</style></head><body><div class="g">
<div class="sw" style="background:#F2F2F7;color:#000000;"><div class="n">background</div><div class="v">#F2F2F7</div></div>
<div class="sw" style="background:#FFFFFF;color:#000000;"><div class="n">surface</div><div class="v">#FFFFFF</div></div>
<div class="sw" style="background:#EDEDF2;color:#000000;"><div class="n">glass</div><div class="v">#EDEDF2</div></div>
<div class="sw" style="background:#000000;color:#FFFFFF;border:2px solid var(--fos-text-12)"><div class="n">text</div><div class="v">#000000</div></div>
</div></body></html>
