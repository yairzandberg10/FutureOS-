<!-- @dsCard group="Colors" viewport="700x160" name="App extensions" subtitle="Six colours that stay local to one app each" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl;height:160px;box-sizing:border-box;padding:20px;overflow:hidden}
.g{display:flex;gap:10px;height:100%}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;border-radius:24px;padding:10px;box-sizing:border-box;min-width:0}
.n{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v{font-family:var(--fos-font-mono);font-size:16px;opacity:.65;white-space:nowrap}
.lbl{font-size:18px;color:var(--fos-text-40);letter-spacing:1px}
a{color:var(--fos-accent)}a:hover{opacity:.7}
</style></head><body><div class="g">
<div class="sw" style="background:#2C2C2E;color:#FFFFFF;"><div class="n">calc button</div><div class="v">#2C2C2E</div></div>
<div class="sw" style="background:#3A3A3C;color:#FFFFFF;"><div class="n">calc muted</div><div class="v">#3A3A3C</div></div>
<div class="sw" style="background:#5A5A5C;color:#FFFFFF;"><div class="n">calc focus</div><div class="v">#5A5A5C</div></div>
<div class="sw" style="background:#111111;color:#FFFFFF;border:2px solid var(--fos-text-12)"><div class="n">input bar</div><div class="v">#111111</div></div>
<div class="sw" style="background:#D0D0D0;color:#000000;"><div class="n">output text</div><div class="v">#D0D0D0</div></div>
<div class="sw" style="background:#FFC107;color:#000000;"><div class="n">favorite</div><div class="v">#FFC107</div></div>
</div></body></html>
