<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl;height:320px;box-sizing:border-box;padding:20px;overflow:hidden}
.g{display:flex;gap:10px;height:100%}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;border-radius:12px;padding:10px;box-sizing:border-box;min-width:0}
.n{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v{font-family:var(--fos-font-mono);font-size:16px;opacity:.65;white-space:nowrap}
.lbl{font-size:18px;color:var(--fos-text-40);letter-spacing:1px}
a{color:var(--fos-accent)}a:hover{opacity:.7}
</style></head><body><div style="background:var(--fos-surface);border-radius:16px;padding:0;overflow:hidden;position:relative">
<div style="position:absolute;inset:0 0 0 auto;width:32px;background:var(--fos-accent);opacity:.18"></div>
<div style="position:absolute;inset:0 auto 0 0;width:32px;background:var(--fos-accent);opacity:.18"></div>
<div style="padding:0 32px;display:flex;flex-direction:column;gap:24px">
<div style="height:56px;background:var(--fos-text-08);border-radius:16px;margin-top:24px"></div><div style="height:56px;background:var(--fos-text-08);border-radius:16px;margin-top:0px"></div><div style="height:56px;background:var(--fos-text-08);border-radius:16px;margin-top:0px"></div>
<div style="height:24px"></div></div></div></body></html>
