<!-- @dsCard group="Colors" viewport="700x190" name="Semantic" subtitle="danger / success / warning, dark over light" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl;height:190px;box-sizing:border-box;padding:20px;overflow:hidden}
.g{display:flex;gap:10px;height:100%}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;border-radius:12px;padding:10px;box-sizing:border-box;min-width:0}
.n{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v{font-family:var(--fos-font-mono);font-size:16px;opacity:.65;white-space:nowrap}
.lbl{font-size:18px;color:var(--fos-text-40);letter-spacing:1px}
a{color:var(--fos-accent)}a:hover{opacity:.7}
</style></head><body><div style="display:flex;flex-direction:column;gap:8px;height:100%">
<div class="g"><div class="sw" style="background:#FF6B6B;color:#000000;"><div class="n">danger</div><div class="v">#FF6B6B</div></div><div class="sw" style="background:#32D74B;color:#000000;"><div class="n">success</div><div class="v">#32D74B</div></div><div class="sw" style="background:#FFD60A;color:#000000;"><div class="n">warning</div><div class="v">#FFD60A</div></div></div>
<div class="g"><div class="sw" style="background:#D32F2F;color:#FFFFFF;"><div class="n">danger</div><div class="v">#D32F2F</div></div><div class="sw" style="background:#1E8E3E;color:#FFFFFF;"><div class="n">success</div><div class="v">#1E8E3E</div></div><div class="sw" style="background:#B8860B;color:#FFFFFF;"><div class="n">warning</div><div class="v">#B8860B</div></div></div>
</div></body></html>
