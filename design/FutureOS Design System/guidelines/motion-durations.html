<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl;height:240px;box-sizing:border-box;padding:20px;overflow:hidden}
.g{display:flex;gap:10px;height:100%}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;border-radius:12px;padding:10px;box-sizing:border-box;min-width:0}
.n{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v{font-family:var(--fos-font-mono);font-size:16px;opacity:.65;white-space:nowrap}
.lbl{font-size:18px;color:var(--fos-text-40);letter-spacing:1px}
a{color:var(--fos-accent)}a:hover{opacity:.7}
</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:14px"><div style="font-size:20px;font-weight:600;width:140px">instant</div><div style="font-family:var(--fos-font-mono);font-size:17px;opacity:.6;width:72px">0ms</div><div style="height:12px;border-radius:6px;background:var(--fos-accent);width:8px"></div><div style="font-size:18px;opacity:.5">animations off</div></div><div style="display:flex;align-items:center;gap:14px"><div style="font-size:20px;font-weight:600;width:140px">fast</div><div style="font-family:var(--fos-font-mono);font-size:17px;opacity:.6;width:72px">150ms</div><div style="height:12px;border-radius:6px;background:var(--fos-accent);width:83px"></div><div style="font-size:18px;opacity:.5">colour or alpha in place</div></div><div style="display:flex;align-items:center;gap:14px"><div style="font-size:20px;font-weight:600;width:140px">standard</div><div style="font-family:var(--fos-font-mono);font-size:17px;opacity:.6;width:72px">200ms</div><div style="height:12px;border-radius:6px;background:var(--fos-accent);width:108px"></div><div style="font-size:18px;opacity:.5">focus move, menu open</div></div><div style="display:flex;align-items:center;gap:14px"><div style="font-size:20px;font-weight:600;width:140px">emphasized</div><div style="font-family:var(--fos-font-mono);font-size:17px;opacity:.6;width:72px">300ms</div><div style="height:12px;border-radius:6px;background:var(--fos-accent);width:158px"></div><div style="font-size:18px;opacity:.5">screen transition</div></div><div style="display:flex;align-items:center;gap:14px"><div style="font-size:20px;font-weight:600;width:140px">slow</div><div style="font-family:var(--fos-font-mono);font-size:17px;opacity:.6;width:72px">450ms</div><div style="height:12px;border-radius:6px;background:var(--fos-accent);width:233px"></div><div style="font-size:18px;opacity:.5">long content</div></div>
</div></body></html>
