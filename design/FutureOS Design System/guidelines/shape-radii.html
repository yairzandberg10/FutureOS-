<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl;height:300px;box-sizing:border-box;padding:20px;overflow:hidden}
.g{display:flex;gap:10px;height:100%}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;border-radius:12px;padding:10px;box-sizing:border-box;min-width:0}
.n{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v{font-family:var(--fos-font-mono);font-size:16px;opacity:.65;white-space:nowrap}
.lbl{font-size:18px;color:var(--fos-text-40);letter-spacing:1px}
a{color:var(--fos-accent)}a:hover{opacity:.7}
</style></head><body><div style="display:flex;flex-wrap:wrap;gap:10px">
<div style="width:108px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:72px;background:var(--fos-surface);border:2px solid var(--fos-text-20);border-radius:16px;box-sizing:border-box"></div><div style="font-size:17px">item</div><div style="font-family:var(--fos-font-mono);font-size:15px;opacity:.55">8dp</div></div><div style="width:108px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:72px;background:var(--fos-surface);border:2px solid var(--fos-text-20);border-radius:20px;box-sizing:border-box"></div><div style="font-size:17px">field</div><div style="font-family:var(--fos-font-mono);font-size:15px;opacity:.55">10dp</div></div><div style="width:108px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:72px;background:var(--fos-surface);border:2px solid var(--fos-text-20);border-radius:24px;box-sizing:border-box"></div><div style="font-size:17px">tab</div><div style="font-family:var(--fos-font-mono);font-size:15px;opacity:.55">12dp</div></div><div style="width:108px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:72px;background:var(--fos-surface);border:2px solid var(--fos-text-20);border-radius:28px;box-sizing:border-box"></div><div style="font-size:17px">chip</div><div style="font-family:var(--fos-font-mono);font-size:15px;opacity:.55">14dp</div></div><div style="width:108px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:72px;background:var(--fos-surface);border:2px solid var(--fos-text-20);border-radius:32px;box-sizing:border-box"></div><div style="font-size:17px">card</div><div style="font-family:var(--fos-font-mono);font-size:15px;opacity:.55">16dp</div></div><div style="width:108px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:72px;background:var(--fos-surface);border:2px solid var(--fos-text-20);border-radius:40px;box-sizing:border-box"></div><div style="font-size:17px">dialog</div><div style="font-family:var(--fos-font-mono);font-size:15px;opacity:.55">20dp</div></div><div style="width:108px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:72px;background:var(--fos-surface);border:2px solid var(--fos-text-20);border-radius:44px;box-sizing:border-box"></div><div style="font-size:17px">main</div><div style="font-family:var(--fos-font-mono);font-size:15px;opacity:.55">22dp</div></div><div style="width:108px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:72px;background:var(--fos-surface);border:2px solid var(--fos-text-20);border-radius:56px;box-sizing:border-box"></div><div style="font-size:17px">heads-up</div><div style="font-family:var(--fos-font-mono);font-size:15px;opacity:.55">28dp</div></div><div style="width:108px;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:72px;background:var(--fos-surface);border:2px solid var(--fos-text-20);border-radius:9999px;box-sizing:border-box"></div><div style="font-size:17px">full</div><div style="font-family:var(--fos-font-mono);font-size:15px;opacity:.55">∞</div></div>
</div></body></html>
