<!-- @dsCard group="Brand" viewport="700x310" name="The three states" subtitle="Normal, focused, selected. Hover, pressed and dragged do not physically exist" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl;height:310px;box-sizing:border-box;padding:20px;overflow:hidden}
.g{display:flex;gap:10px;height:100%}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;border-radius:12px;padding:10px;box-sizing:border-box;min-width:0}
.n{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v{font-family:var(--fos-font-mono);font-size:16px;opacity:.65;white-space:nowrap}
.lbl{font-size:18px;color:var(--fos-text-40);letter-spacing:1px}
a{color:var(--fos-accent)}a:hover{opacity:.7}
</style></head><body><div style="display:flex;flex-direction:column;gap:18px">
<div style="display:flex;align-items:center;gap:20px"><div class="lbl" style="width:110px">normal</div><div style="flex:1;height:64px;border-radius:16px;border:3px solid transparent;box-sizing:border-box;display:flex;align-items:center;padding:0 24px;font-size:30px">מיכל לוי</div></div>
<div style="display:flex;align-items:center;gap:20px"><div class="lbl" style="width:110px">focused</div><div style="flex:1;height:64px;border-radius:16px;background:var(--fos-accent-14);border:3px solid var(--fos-accent);box-sizing:border-box;display:flex;align-items:center;padding:0 24px;font-size:30px;transform:scale(1.02)">מיכל לוי</div></div>
<div style="display:flex;align-items:center;gap:20px"><div class="lbl" style="width:110px">selected</div><div style="flex:1;height:64px;border-radius:16px;background:var(--fos-accent);color:var(--fos-on-accent);box-sizing:border-box;display:flex;align-items:center;padding:0 24px;font-size:30px;font-weight:500">מיכל לוי</div></div>
<div style="font-size:19px;color:var(--fos-text-40)">Selected always beats focused: solid accent fill, black label. There is no uniform disabled state.</div>
</div></body></html>
