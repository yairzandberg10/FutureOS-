<!-- @dsCard group="Clock" viewport="640x960" name="Clock & alarms" subtitle="Bottom nav, alarm rows, the full-screen time picker" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>FutureOS · שעון</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:#0A0A0B}
.device{width:640px;height:960px;background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl;position:relative;overflow:hidden;margin:0 auto;display:flex;flex-direction:column}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.hint{position:absolute;bottom:0;left:0;right:0;padding:10px 16px;font-size:20px;color:var(--fos-text-30);text-align:center;pointer-events:none;background:linear-gradient(to top,var(--fos-bg),transparent)}
.over{position:absolute;inset:0;z-index:5}
a{color:var(--fos-accent)}a:hover{opacity:.7}
</style></head><body>
<div id="root"></div>
<script type="text/babel" src="ClockScreens.jsx"></script>
<script type="text/babel">
const { BottomNav, TimePicker } = window.FutureOSDesignSystem_3ab611;
const TABS = [{ label: "מעורר", icon: "alarm" }, { label: "שעון עולמי", icon: "public" }, { label: "סטופר", icon: "timer" }, { label: "טיימר", icon: "hourglass_empty" }];

function App() {
  const [tab, setTab] = React.useState(0);
  const [focus, setFocus] = React.useState(0);
  const [alarms, setAlarms] = React.useState(window.ALARMS);
  const [editing, setEditing] = React.useState(-1);
  const [running, setRunning] = React.useState(false);
  const [day, setDay] = React.useState(5);

  React.useEffect(() => {
    const onKey = (e) => {
      if (editing >= 0) {
        if (e.key === "ArrowLeft") setDay(d => (d + 1) % 7);
        else if (e.key === "ArrowRight") setDay(d => (d + 6) % 7);
        else if (["Enter","Escape","Backspace"].includes(e.key)) setEditing(-1);
        else return;
        e.preventDefault(); return;
      }
      if (e.key === "ArrowDown") setFocus(f => Math.min((tab === 0 ? alarms.length : tab === 1 ? window.ZONES.length : 1) - 1, f + 1));
      else if (e.key === "ArrowUp") setFocus(f => Math.max(0, f - 1));
      else if (e.key === "ArrowLeft") { setTab(t => Math.min(3, t + 1)); setFocus(0); }
      else if (e.key === "ArrowRight") { setTab(t => Math.max(0, t - 1)); setFocus(0); }
      else if (e.key === "Enter") {
        if (tab === 0) setEditing(focus);
        if (tab === 2 || tab === 3) setRunning(r => !r);
      }
      else if (e.key === "s" && tab === 0) setAlarms(a => a.map((x, i) => i === focus ? { ...x, on: !x.on } : x));
      else return;
      e.preventDefault();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [tab, focus, editing, alarms]);

  if (editing >= 0) {
    const a = alarms[editing];
    return <div className="device">
      <TimePicker hours={a.time.split(":")[0]} minutes={a.time.split(":")[1]} focusedDay={day}
        repeat={[0,1,2,3,4]} onCancel={() => setEditing(-1)} onSave={() => setEditing(-1)} style={{ flex: 1 }} />
    </div>;
  }

  const screen = [
    <window.AlarmsScreen focus={focus} alarms={alarms} onEdit={setEditing} />,
    <window.WorldClockScreen focus={focus} />,
    <window.StopwatchScreen running={running} value={0.42} />,
    <window.TimerScreen running={running} value={0.92} />
  ][tab];

  return (
    <div className="device">
      <div className="body">{screen}<div className="hint">חיצים · Enter · s למתג</div></div>
      <BottomNav items={TABS} selected={tab} onSelect={(i) => { setTab(i); setFocus(0); }} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
