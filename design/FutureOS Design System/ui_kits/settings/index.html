<!-- @dsCard group="Settings" viewport="640x960" name="Settings" subtitle="Cards, rows, switches, sliders, accent picker, confirm dialog" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<title>FutureOS · הגדרות</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;background:#0A0A0B}
.device{width:640px;height:960px;background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl;position:relative;overflow:hidden;margin:0 auto}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>div{padding-bottom:64px}
.hint{position:absolute;bottom:0;left:0;right:0;padding:10px 16px;font-size:20px;color:var(--fos-text-30);background:linear-gradient(to top,var(--fos-bg),transparent);text-align:center;pointer-events:none}
a{color:var(--fos-accent)}a:hover{opacity:.7}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="SettingsScreens.jsx"></script>
<script type="text/babel">
const { ConfirmDialog, OptionsMenu } = window.FutureOSDesignSystem_3ab611;
const COUNTS = { root: 6, display: 5, accent: 5, sound: 3, about: 3, language: 0, keys: 0 };

function App() {
  const [screen, setScreen] = React.useState("root");
  const [focus, setFocus] = React.useState(0);
  const [rootFocus, setRootFocus] = React.useState(0);
  const [menu, setMenu] = React.useState(false);
  const [dialog, setDialog] = React.useState(false);
  const [accent, setAccent] = React.useState(0);
  const [vals, setVals] = React.useState({ brightness: 0.4, textSize: 0.5, media: 0.7, ring: 0.5, notif: 0.3, dark: true, adaptive: false, anim: true });

  const go = (id, idx) => { setRootFocus(idx); setFocus(0); setScreen(id); };
  const back = () => { setScreen("root"); setFocus(rootFocus); };
  const toggle = (k) => setVals(v => ({ ...v, [k]: !v[k] }));

  React.useEffect(() => {
    const onKey = (e) => {
      const n = COUNTS[screen] || 0;
      if (menu) {
        if (e.key === "ArrowDown") setFocus(f => (f + 1) % 5);
        else if (e.key === "ArrowUp") setFocus(f => (f + 4) % 5);
        else if (e.key === "Escape" || e.key === "Backspace") setMenu(false);
        else if (e.key === "Enter") setMenu(false);
        e.preventDefault(); return;
      }
      if (dialog) { if (e.key === "Escape" || e.key === "Backspace" || e.key === "Enter") setDialog(false); e.preventDefault(); return; }
      if (e.key === "ArrowDown") setFocus(f => Math.min(n - 1, f + 1));
      else if (e.key === "ArrowUp") setFocus(f => Math.max(0, f - 1));
      else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        const d = e.key === "ArrowLeft" ? 0.05 : -0.05;
        if (screen === "display" && focus < 2) setVals(v => ({ ...v, [focus === 0 ? "brightness" : "textSize"]: Math.max(0, Math.min(1, v[focus === 0 ? "brightness" : "textSize"] + d)) }));
        if (screen === "sound") { const k = ["media","ring","notif"][focus]; setVals(v => ({ ...v, [k]: Math.max(0, Math.min(1, v[k] + d)) })); }
      }
      else if (e.key === "Enter") {
        if (screen === "root") go(window.GROUPS.flatMap(g => g.rows)[focus].id, focus);
        else if (screen === "accent") setAccent(focus);
        else if (screen === "display" && focus >= 2) toggle(["dark","adaptive","anim"][focus - 2]);
        else if (screen === "about" && focus === 2) setDialog(true);
      }
      else if (e.key === "Escape" || e.key === "Backspace") { if (screen !== "root") back(); }
      else if (e.key === "m") setMenu(true);
      else return;
      e.preventDefault();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [screen, focus, menu, dialog, rootFocus]);

  const accentVal = window.ACCENTS[accent].value;
  const body = {
    root: <window.SettingsRoot focus={focus} onOpen={go} accentName={window.ACCENTS[accent].name} />,
    display: <window.DisplayScreen focus={focus} values={vals} onBack={back} onToggle={toggle} />,
    accent: <window.AccentScreen focus={focus} selected={accent} onBack={back} onPick={setAccent} />,
    sound: <window.SoundScreen focus={focus} values={vals} onBack={back} />,
    about: <window.AboutScreen focus={focus} onBack={back} onReset={() => setDialog(true)} />
  }[screen] || <window.SettingsRoot focus={focus} onOpen={go} accentName={window.ACCENTS[accent].name} />;

  const scrollRef = React.useRef(null);
  React.useEffect(() => {
    const c = scrollRef.current;
    if (!c) return;
    const el = c.querySelector('[data-f="' + focus + '"]');
    if (!el) return;
    const top = el.offsetTop, bottom = top + el.offsetHeight;
    if (top < c.scrollTop + 140) c.scrollTop = Math.max(0, top - 140);
    else if (bottom > c.scrollTop + c.clientHeight - 80) c.scrollTop = bottom - c.clientHeight + 80;
  }, [focus, screen]);

  return (
    <div className="device" style={{ "--fos-accent": accentVal, "--fos-font-scale": 0.8 + vals.textSize * 0.6 }}>
      <div className="scroll" ref={scrollRef}>{body}</div>
      {menu && <OptionsMenu header="הגדרות" focusedIndex={focus} items={[
        { label: "חיפוש", icon: "search" }, { label: "מצב כהה", icon: "dark_mode" },
        { label: "עזרה", icon: "help" }, { label: "אודות", icon: "info" },
        { label: "איפוס", icon: "restart_alt", destructive: true }]} onSelect={() => setMenu(false)} />}
      {dialog && <ConfirmDialog message="לאפס את כל ההגדרות?" confirmLabel="אפס" onConfirm={() => setDialog(false)} onCancel={() => setDialog(false)} />}
      <div className="hint">חיצים · Enter · Backspace · m לתפריט</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
