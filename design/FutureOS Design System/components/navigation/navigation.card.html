<!-- @dsCard group="Components" viewport="700x1980" name="Navigation" subtitle="Bottom nav, soft-key bar, menu-key overlay, view tabs, dynamic status capsule" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<title>FutureOS · Navigation</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl}
.wrap{padding:28px 20px;display:flex;flex-direction:column;gap:22px}
.lbl{font-size:22px;color:var(--fos-text-40);letter-spacing:1px}
.row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
a{color:var(--fos-accent)}a:hover{opacity:.7}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { BottomNav, OptionsMenu, TabRow, SoftKeyBar, StatusCapsule, FosIcon } = window.FutureOSDesignSystem_3ab611;
const L = ({children}) => <div className="lbl">{children}</div>;
const WALL = "radial-gradient(circle at 18% 12%, #e0894a 0, transparent 46%), radial-gradient(circle at 88% 28%, #4b8fc4 0, transparent 52%), radial-gradient(circle at 36% 92%, #8a52b0 0, transparent 56%), #2a3350";
const Device = () => <StatusCapsule>
  <FosIcon name="wifi" size={28} color="var(--fos-shell-ink-70)" />
  <FosIcon name="signal_cellular_alt" size={28} color="var(--fos-shell-ink-70)" />
  <span style={{fontSize:"var(--fos-size-label)",fontWeight:"var(--fos-weight-medium)"}}>76%</span>
  <FosIcon name="battery_full" size={28} color="var(--fos-shell-ink)" />
</StatusCapsule>;
const Bar = ({children}) => <div style={{height:56,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 16px"}}>{children}</div>;
const STATES = [
  {state:"idle",time:"07:30",apps:["chat","email"]},
  {state:"call",label:"1:24"},
  {state:"charging",label:"בטעינה · 76%"},
  {state:"notification",icon:"chat",label:"הודעות"},
  {state:"media",label:"בוקר טוב"}
];
function Cycle(){
  const [i,setI] = React.useState(0);
  React.useEffect(()=>{const t=setInterval(()=>setI(n=>(n+1)%STATES.length),2000);return ()=>clearInterval(t);},[]);
  return <Bar><StatusCapsule {...STATES[i]} /><Device /></Bar>;
}
function App(){return <div className="wrap">
  <L>TabRow · selected / focused / idle</L>
  <div style={{margin:"0 -20px"}}><TabRow items={["יום","שבוע","חודש"]} selected={0} focusedIndex={1} /></div>
  <L>BottomNav · items never take focus</L>
  <div style={{margin:"0 -20px"}}><BottomNav selected={0} items={[{label:"ראשי",icon:"home"},{label:"אימונים",icon:"fitness_center"},{label:"התקדמות",icon:"trending_up"}]} /></div>
  <L>SoftKeyBar · the two soft keys and the OK key</L>
  <div style={{margin:"0 -20px",display:"flex",flexDirection:"column",gap:14}}>
    <SoftKeyBar left="אפשרויות" center="בחר" right="חזור" />
    <SoftKeyBar left="סמן" center="פתח" right="תפריט" />
  </div>
  <L>OptionsMenu · opened by the menu key</L>
  <div style={{position:"relative",height:700,background:"var(--fos-bg)",border:"2px solid var(--fos-text-12)",borderRadius:"var(--fos-radius-card)",overflow:"hidden"}}>
    <OptionsMenu header="מסמך חדש" focusedIndex={1} items={[
      {label:"שתף",icon:"share"},{label:"שנה שם",icon:"edit"},{label:"העתק",icon:"content_copy"},
      {label:"פרטים",icon:"info"},{label:"מחק",icon:"delete",destructive:true}]} />
  </div>
  <L>StatusCapsule · idle, call, charging, notification, media, and idle with more than four apps — over a transparent bar</L>
  <div style={{background:WALL,borderRadius:"var(--fos-radius-card)",padding:"12px 0",display:"flex",flexDirection:"column",gap:8}}>
    {STATES.map(s => <Bar key={s.state}><StatusCapsule {...s} /><Device /></Bar>)}
    <Bar><StatusCapsule time="07:30" apps={["chat","email","calendar_today","alarm","call_missed"]} /><Device /></Bar>
  </div>
  <L>StatusCapsule · widening on the standard 200ms easing, no bounce — cycles every two seconds (in the app a call lasts as long as the call, charging and a new notification about 3 seconds, media while it plays)</L>
  <div style={{background:WALL,borderRadius:"var(--fos-radius-card)",padding:"12px 0"}}><Cycle /></div>
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
