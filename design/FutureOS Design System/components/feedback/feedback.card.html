<!-- @dsCard group="Components" viewport="700x3800" name="Feedback" subtitle="Confirm and input dialogs, heads-up, snackbar, progress, spinner, badge, glass panel, notification card" -->
<!DOCTYPE html><html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<title>FutureOS · Feedback</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{background:var(--fos-bg);color:var(--fos-text);font-family:var(--fos-font);direction:rtl}
.wrap{padding:28px 20px;display:flex;flex-direction:column;gap:22px}
.lbl{font-size:22px;color:var(--fos-text-40);letter-spacing:1px}
.row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
a{color:var(--fos-accent)}a:hover{opacity:.7}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { ConfirmDialog, InputDialog, HeadsUpNotification, Snackbar, ProgressBar, Spinner, Badge, ListItem, GlassPanel, GlassTile, NotificationCard, Slider, FosIcon } = window.FutureOSDesignSystem_3ab611;
const L = ({children}) => <div className="lbl">{children}</div>;
const WALL = "radial-gradient(circle at 18% 12%, #e0894a 0, transparent 46%), radial-gradient(circle at 88% 28%, #4b8fc4 0, transparent 52%), radial-gradient(circle at 36% 92%, #8a52b0 0, transparent 56%), #2a3350";
const Frame = ({children}) => <div style={{borderRadius:"var(--fos-radius-card)",overflow:"hidden",border:"2px solid var(--fos-text-12)"}}>{children}</div>;
const SHADOW = "var(--fos-shell-text-shadow)";
const Round = ({icon,label,on,focused}) => <div style={{width:108,display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
  <GlassTile on={on} focused={focused} radius="var(--fos-radius-full)" style={{width:76,height:76,display:"grid",placeItems:"center"}}><FosIcon name={icon} size={40} color="currentColor" /></GlassTile>
  <span style={{fontSize:22,textShadow:SHADOW}}>{label}</span>
</div>;
const Pill = ({icon,label,on,focused}) => <GlassTile focused={focused} style={{flex:1,height:110,padding:12,display:"flex",alignItems:"center",gap:20}}>
  <GlassTile on={on} radius="var(--fos-radius-full)" style={{width:80,height:80,flex:"0 0 auto",display:"grid",placeItems:"center",border:"none"}}><FosIcon name={icon} size={36} color="currentColor" /></GlassTile>
  <span style={{fontSize:"var(--fos-size-label)",fontWeight:"var(--fos-weight-medium)"}}>{label}</span>
</GlassTile>;
const PanelButton = ({icon,label,focused}) => <GlassTile focused={focused} radius="var(--fos-radius-full)" style={{flex:1,height:76,display:"flex",alignItems:"center",justifyContent:"center",gap:12,fontSize:"var(--fos-size-label)",fontWeight:"var(--fos-weight-semibold)"}}><FosIcon name={icon} size={36} color="currentColor" />{label}</GlassTile>;
const Stage = ({h, children}) => <div style={{position:"relative",height:h,background:"var(--fos-bg)",border:"2px solid var(--fos-text-12)",borderRadius:"var(--fos-radius-card)",overflow:"hidden"}}>{children}</div>;
function App(){return <div className="wrap">
  <L>HeadsUpNotification · always dark</L>
  <HeadsUpNotification appName="הודעות" title="מיכל לוי" body="נתראה בערב" icon="chat" />
  <L>ConfirmDialog · focus on the destructive action</L>
  <Stage h={300}><ConfirmDialog message="למחוק את איש הקשר?" confirmLabel="מחק" /></Stage>
  <L>InputDialog</L>
  <Stage h={360}><InputDialog title="שם חדש" value="מסמך חדש" /></Stage>
  <L>ProgressBar · 4dp / 2dp</L>
  <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div style={{fontSize:"var(--fos-size-body)",color:"var(--fos-text-60)"}}>מוריד קובץ</div>
    <ProgressBar value={0.62} />
    <div style={{fontSize:"var(--fos-size-body)",color:"var(--fos-text-60)",marginTop:10}}>מנגן</div>
    <ProgressBar value={0.3} mini />
  </div>
  <L>Snackbar · with and without an action</L>
  <div style={{display:"flex",flexDirection:"column",gap:14,margin:"0 -20px"}}>
    <Snackbar message="ההודעה נמחקה" action="בטל" />
    <Snackbar message="ההגדרות נשמרו" />
  </div>
  <L>Spinner · indeterminate, with and without a label</L>
  <div className="row" style={{gap:40}}>
    <Spinner label="מחפש מכשירים" />
    <Spinner size={48} thickness={6} />
  </div>
  <L>Badge</L>
  <ListItem title="דני כהן" summary="נתראה בערב" trailing={<Badge count={2} />} />
  <L>GlassPanel · Control Center — blurred snapshot, 20% white wash; toggle pills and icon toggles (on / focused / idle), sliders, media card</L>
  <Frame>
    <GlassPanel wallpaper={WALL}>
      <div style={{marginTop:24,display:"flex",gap:20}}>
        <Pill icon="wifi" label="Wi-Fi" on />
        <Pill icon="bluetooth" label="Bluetooth" focused />
      </div>
      <div style={{display:"flex",gap:20}}>
        <Pill icon="flashlight_on" label="פנס" />
        <Pill icon="airplanemode_active" label="מצב טיסה" />
      </div>
      <div style={{display:"flex",justifyContent:"space-around"}}>
        <Round icon="signal_cellular_alt" label="נתונים" on />
        <Round icon="do_not_disturb_on" label="נא לא להפריע" focused />
        <Round icon="location_on" label="מיקום" />
        <Round icon="settings" label="הגדרות" />
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        <Slider icon="brightness_6" label="בהירות" value={0.6} focused style={{margin:0}} />
        <Slider icon="volume_up" label="עוצמת קול" value={0.3} style={{margin:0}} />
      </div>
      <GlassTile style={{height:130,padding:"0 28px",display:"flex",alignItems:"center",gap:24,marginBottom:16}}>
        <GlassTile radius="var(--fos-radius-full)" style={{width:80,height:80,flex:"0 0 auto",display:"grid",placeItems:"center",border:"none"}}><FosIcon name="music_note" size={36} color="currentColor" /></GlassTile>
        <span style={{fontSize:"var(--fos-size-summary)",fontWeight:"var(--fos-weight-bold)"}}>אין מוזיקה מתנגנת</span>
      </GlassTile>
    </GlassPanel>
  </Frame>
  <L>GlassPanel · Notification Center — NotificationCard focused and expanded, collapsed, options open; pill buttons below</L>
  <Frame>
    <GlassPanel wallpaper={WALL}>
      <div style={{marginTop:24}}>
        <div style={{fontSize:"var(--fos-size-header)",fontWeight:"var(--fos-weight-bold)",lineHeight:1.1,textShadow:SHADOW}}>07:30</div>
        <div style={{fontSize:"var(--fos-size-label)",color:"var(--fos-shell-ink-sub)",marginTop:4,textShadow:SHADOW}}>יום רביעי, 1 באוקטובר</div>
      </div>
      <NotificationCard focused expanded appName="הודעות" title="מיכל לוי" body="נתראה בערב, אני מביאה את הדברים מהחנות בדרך הביתה ואם צריך עוד משהו תכתבו לי" />
      <NotificationCard appName="לוח שנה" icon="calendar_today" title="ישיבת צוות" body="בעוד 15 דקות" />
      <NotificationCard focused optionsOpen focusedOption={0} appName="הודעות"
        options={[
          {label:"סמן כנקרא"},
          {label:"כבה התראות",destructive:true},
          {label:"חזור"}
        ]} />
      <div style={{display:"flex",gap:24,marginBottom:16}}>
        <PanelButton icon="delete" label="נקה הכל" focused />
        <PanelButton icon="notifications_off" label="השתק" />
      </div>
    </GlassPanel>
  </Frame>
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
