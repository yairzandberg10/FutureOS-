<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>FutureOS reel</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;background:#000}
#stage{position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;font-family:Heebo,sans-serif}
#scenes{position:absolute;left:0;top:0;width:100%;height:100%}
.scene{position:absolute;left:0;top:0;overflow:hidden;display:none}
.a{position:absolute;left:0;top:0}
.g{position:absolute;width:0;height:0;transform-origin:0 0}
.tx,.txb{position:absolute;left:0;top:0;white-space:nowrap}
.ui{position:absolute;white-space:nowrap;box-sizing:border-box}
svg{overflow:visible;display:block}
</style>
<script>
// Project settings. render.py and audio.py read them from here, so this is the only place they live.
window.CONFIG = {
  W: 1080, H: 1920,     // Instagram Reels / Stories (9:16)
  DUR: 33.5,              // the reel: a cut of the launch film (reel-edit.js)
  FPS: 30,
  bg: '#000000',
  palette: { INK: '#000000', INK2: '#1C1C1E', PAPER: '#2C2C2E', WHITE: '#FFFFFF', RED: '#FF3434', BLUE: '#64D2FF', YELLOW: '#FF9F0A', GREY: '#8E8E93' },
  loop: false,
  hold: 2.4,            // the logo lockup at the end may stand still
  bpm: 120, beat0: 0,
  music: { file: 'bed.wav', start: 0, gain: 0 },   // an original synthesised bed (bed.py), 120 BPM from t = 0; swap for the user's track later
  snap: false,          // key clicks stay frame-exact (they already sit on the grid)
};
</script>
</head>
<body>
<div id="stage"><div id="scenes"></div></div>
<script src="core.js"></script>
<script src="three.min.js"></script>
<script src="fos-data.js"></script>
<script src="fos-timeline.js"></script>
<script src="reel-edit.js"></script>
<script src="fos-phone.js"></script>
<script src="fos-ui.js"></script>
<script src="fos-overlay.js"></script>
<script src="scene.js"></script>
</body>
</html>
