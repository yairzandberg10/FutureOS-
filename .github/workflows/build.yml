name: Build all apps

# CI אחד לכל האפליקציות בריפו. רשימת האפליקציות מתגלה בזמן ריצה ולא
# מקודדת קשיח במטריצה: הגרסה הקודמת החזיקה רשימה של 23 שמות, ובזמן
# שהריפו גדל ל-28 אפליקציות היא פספסה בשקט את Bluetooth, Flashlight,
# Frixa, SystemUI ו-Tasks - כלומר שבירה באחת מהחמש הייתה נכנסת ל-main
# בלי שאף job ייכשל. זו אותה תקלה שקרתה גם ב-build-all.sh וב-DEVICE_SETUP.md
# (ר' CHANGELOG.md); כאן היא הייתה המזיקה ביותר, כי CI הוא בדיוק המקום
# שאמור לתפוס רגרסיות.
#
# job נפרד לכל אפליקציה (ולא לולאה בתוך job אחד) כדי שכשל באפליקציה אחת
# לא יעצור או יסתיר את השאר, וכדי שגיטהאב יראה סטטוס ברור פר-אפליקציה.
#
# JDK 21 בכל ה-jobs, לא רק באפליקציות שדורשות אותו - JDK חדש יותר מקמפל
# ליעד Java 11 בלי בעיה, אז אין צורך במטריצת JDK נפרדת. ר' DEVICE_SETUP.md
# לפרטים על אילו 5 אפליקציות דורשות בפועל Java 21.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  discover-apps:
    name: Discover apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      # כל תיקייה ברמה העליונה שיש בה settings.gradle.kts היא פרויקט
      # Gradle עצמאי, כלומר אפליקציה. SharedKeypadNav נופל מהרשימה
      # בצדק לפי אותו קריטריון - הוא com.android.library בלי
      # settings.gradle.kts משלו, ויש לו job נפרד למטה.
      - id: find
        name: Find every standalone Gradle project
        run: |
          apps=$(find . -mindepth 2 -maxdepth 2 -name settings.gradle.kts -printf '%h\n' \
                 | sed 's|^\./||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Discovered: $apps"
      - name: Fail if nothing was discovered
        run: |
          count=$(echo '${{ steps.find.outputs.apps }}' | jq 'length')
          echo "app count: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::No apps discovered - the layout changed and this workflow needs updating."
            exit 1
          fi

  build-shared-module:
    name: SharedKeypadNav (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # אין gradlew משלו (ר' SharedKeypadNav/README.md) - נבנה/נבדק דרך
      # אחד הצרכנים שלו (Terminal, הקטן ביותר).
      - name: Run SharedKeypadNav unit tests via Terminal
        working-directory: Terminal
        run: ./gradlew :sharedkeypadnav:testDebugUnitTest --console=plain

  build-app:
    name: ${{ matrix.app }}
    needs: discover-apps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover-apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        working-directory: ${{ matrix.app }}
        run: ./gradlew assembleDebug --console=plain
      - name: Run unit tests (if any)
        working-directory: ${{ matrix.app }}
        run: ./gradlew testDebugUnitTest --console=plain
