name: Release APKs for the phone

# בונה גרסת release של כל אפליקציה שהשתנתה, חותם אותה באותו מפתח debug של
# המחשב של המשתמש (נשמר כסוד DEBUG_KEYSTORE_BASE64), ומעלה אותה לגרסה "apks"
# ב-GitHub Releases. כך מתקינים בטלפון מעל הגרסה הקיימת, בלי למחוק נתונים
# ובלי לבנות במחשב (ר' CLAUDE.md): adb install -r <הקובץ שהורד>.
#
# בלי הסוד אין חתימה תואמת, וה-workflow מדלג עם הודעה ברורה במקום לפרסם APK
# שלא יותקן מעל הקיים.

on:
  push:
    branches: [main]
    paths: ["apps/**"]
  workflow_dispatch:
    inputs:
      apps:
        description: "אפליקציות לבנייה, מופרדות בפסיק (למשל Navigation,Settings), או all"
        required: true
        default: all

permissions:
  contents: write # יצירת/עדכון הגרסה "apks" בלבד

concurrency:
  group: release-apks
  cancel-in-progress: false

jobs:
  plan:
    name: Pick apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
      signing: ${{ steps.key.outputs.signing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: key
        name: Check for the signing key secret
        env:
          KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY" ]; then echo "signing=yes" >> "$GITHUB_OUTPUT"; else
            echo "signing=no" >> "$GITHUB_OUTPUT"
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set - APKs would not install over the phone's apps, skipping."
          fi
      - id: pick
        name: Which apps changed
        env:
          INPUT: ${{ github.event.inputs.apps }}
          BEFORE: ${{ github.event.before }}
        run: |
          all=$(find apps -mindepth 2 -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | sed 's|^apps/||' | sort)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$INPUT" = "all" ]; then picked="$all"; else picked=$(echo "$INPUT" | tr ',' '\n' | sed 's/ //g'); fi
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
            # שינוי במודול המשותף משפיע על כל האפליקציות
            if echo "$changed" | grep -q '^apps/SharedKeypadNav/'; then picked="$all"; else
              picked=$(echo "$changed" | grep '^apps/' | cut -d/ -f2 | sort -u | grep -Fx -f <(echo "$all") || true)
            fi
          fi
          json=$(echo "$picked" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apps=$json" >> "$GITHUB_OUTPUT"
          echo "Apps: $json"
      - name: Make sure the "apks" release exists
        if: steps.key.outputs.signing == 'yes' && steps.pick.outputs.apps != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apks >/dev/null 2>&1 || \
            gh release create apks --title "APKs לטלפון" --notes "גרסאות release חתומות במפתח של המחשב, מתעדכנות בכל push. התקנה: adb install -r <קובץ>." --prerelease

  build:
    name: ${{ matrix.app }}
    needs: plan
    if: needs.plan.outputs.signing == 'yes' && needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore the signing key
        env:
          KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEY" | base64 -d > ~/.android/debug.keystore
      - name: Assemble release
        working-directory: apps/${{ matrix.app }}
        run: ./gradlew assembleRelease --console=plain
      - name: Upload to the "apks" release
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
        run: |
          apk=$(find "apps/$APP/app/build/outputs/apk/release" -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then echo "::error::no release APK for $APP"; exit 1; fi
          cp "$apk" "$APP-release.apk"
          gh release upload apks "$APP-release.apk" --clobber
      - name: Remove the signing key
        if: always()
        run: rm -f ~/.android/debug.keystore
