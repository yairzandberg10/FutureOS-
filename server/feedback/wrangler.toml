# הגדרות Cloudflare Worker לשרת המשוב. אין כאן סודות ואין account_id:
# הסודות נכנסים ב-`wrangler secret put`, וה-database_id אחרי `wrangler d1 create`.
name = "futureos-feedback"
main = "src/index.js"
compatibility_date = "2026-09-01"

# בכוונה לא מוגדר ENVIRONMENT=local כאן: טוקן המנהל המקומי עובד רק דרך .dev.vars
[vars]
ENVIRONMENT = "production"
FEEDBACK_PER_DAY = "10"
ROUTE_PER_HOUR = "60"
# הגבלות נגד מכשירים מזויפים (הרישום פתוח). "רשת" = IPv4 מלא או /64 ב-IPv6.
# ספקים סלולריים מאחורי CGNAT חולקים IP, אז אם רואים 429 אצל משתמשים אמיתיים - להעלות את ה-NET
REGISTER_PER_HOUR = "20"
REGISTER_PER_DAY = "40"
ROUTE_PER_DAY = "200"
ROUTE_PER_NET_HOUR = "240"
SIRI_PER_DAY = "1500"
SIRI_PER_NET_HOUR = "960"
DAILY_LIMIT_HERE = "5000"
DAILY_LIMIT_SIRI = "20000"
# עדכונים: עצירה אוטומטית של פריסה אחרי 3 כשלי התקנה ומעל 20% כשלים. המפתח: wrangler secret put UPDATE_SIGNING_KEY
UPDATE_PAUSE_MIN_FAILS = "3"
UPDATE_PAUSE_FAIL_RATE = "0.2"
DOWNLOADS_PER_DAY = "30"
GITHUB_REPO = ""            # למשל yairzandberg10/FutureOS-feedback (ריפו פרטי)
GITHUB_REPO_PRIVATE = "false"
ACCESS_TEAM_DOMAIN = ""     # למשל <team>.cloudflareaccess.com
ACCESS_AUD = ""
ADMIN_EMAIL = ""

[[d1_databases]]
binding = "DB"
database_name = "futureos"
database_id = "22e6be22-f19c-4265-96fe-a9d9511c5adb"

# R2 עוד לא מופעל בחשבון. בלעדיו המשוב נשמר בלי לוג, והפצת עדכונים לא זמינה.
# אחרי הפעלה ב-Dashboard: להחזיר את שלוש השורות.
# [[r2_buckets]]
# binding = "BLOBS"
# bucket_name = "futureos-feedback"

# מיון Gemini פעם בשעה
[triggers]
crons = ["17 * * * *"]
